<div id="accion-clima" style="width:100%;font-family:Arial,Helvetica,sans-serif">
<style>
#accion-clima *{box-sizing:border-box}
#accion-clima .bar{height:64px;width:100%;display:flex;background:#fff;border:1px solid #d5e0da;border-radius:6px;overflow:visible;color:#173128}
#accion-clima .now{flex:0 0 245px;background:#006837;color:#fff;display:flex;align-items:center;padding:5px 9px;gap:8px;border-radius:5px 0 0 5px;position:relative;z-index:10}
#accion-clima .icon{width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;font-size:31px;background:rgba(255,255,255,.12);border-radius:50%}
#accion-clima .info{min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:18px 25px 11px;column-gap:6px;align-items:center;flex:1}
#accion-clima .place{grid-column:1/3;display:flex;align-items:center;gap:5px;min-width:0}
#accion-clima .pin{font-size:12px}
#accion-clima .locselect{height:21px;min-width:112px;max-width:150px;padding:1px 22px 1px 6px;border:1px solid #fff;border-radius:4px;background:#fff;color:#006837;font:800 10px Arial,Helvetica,sans-serif;text-transform:uppercase;cursor:pointer;outline:0}
#accion-clima .locselect:focus{box-shadow:0 0 0 2px rgba(255,255,255,.45)}
#accion-clima .temp{font-size:28px;font-weight:800;line-height:1}
#accion-clima .state{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#accion-clima .meta{grid-column:1/3;font-size:7px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#accion-clima .days{display:flex;flex:1;min-width:0;overflow:hidden;background:#fff;border-radius:0 5px 5px 0}
#accion-clima .day{flex:1;min-width:108px;border-right:1px solid #e0e8e3;padding:5px 8px;display:grid;grid-template-columns:1fr auto;grid-template-rows:17px 1fr;align-items:center}
#accion-clima .day:last-child{border-right:0}
#accion-clima .name{font-size:8px;font-weight:800;color:#52645b;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#accion-clima .wicon{grid-row:1/3;grid-column:2;font-size:29px;line-height:1;margin-left:5px}
#accion-clima .vals{font-size:14px;font-weight:800;color:#173128}
#accion-clima .min{font-size:12px;font-weight:800;color:#40564c}
#accion-clima .rain{font-size:11px;font-weight:800;color:#006837;margin-top:3px}
@media(max-width:699px){
#accion-clima .bar{height:62px}
#accion-clima .now{flex-basis:185px;padding:5px 7px;gap:6px}
#accion-clima .icon{width:36px;height:36px;flex-basis:36px;font-size:27px}
#accion-clima .info{grid-template-rows:17px 23px 10px;column-gap:4px}
#accion-clima .locselect{min-width:95px;max-width:112px;height:19px;font-size:8px;padding-left:5px}
#accion-clima .temp{font-size:25px}
#accion-clima .state{font-size:8px;max-width:78px}
#accion-clima .meta{font-size:6px}
#accion-clima .days{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#accion-clima .days::-webkit-scrollbar{display:none}
#accion-clima .day{flex:0 0 108px;scroll-snap-align:start;padding:5px 7px}
#accion-clima .wicon{font-size:27px}
#accion-clima .vals{font-size:13px}
#accion-clima .min{font-size:11px}
#accion-clima .rain{font-size:10px}
}
</style>

<div class="bar">
  <div class="now">
    <div class="icon" id="clima-icon">🌤️</div>
    <div class="info">
      <div class="place">
        <span class="pin">📍</span>
        <select class="locselect" id="clima-loc" aria-label="Elegir localidad">
          <option value="7868">Larroque</option>
          <option value="7851">Gualeguaychú</option>
          <option value="7852">Gualeguay</option>
          <option value="7706">Concordia</option>
          <option value="7641">Paraná</option>
          <option value="7831">Concepción del Uruguay</option>
        </select>
      </div>
      <div class="temp" id="clima-temp">—°</div>
      <div class="state" id="clima-state">Cargando clima…</div>
      <div class="meta" id="clima-meta">SMN</div>
    </div>
  </div>
  <div class="days" id="clima-days"></div>
</div>

<script>
(function(){
var root=document.getElementById('accion-clima');
if(!root||root.getAttribute('data-clima-ok'))return;
root.setAttribute('data-clima-ok','1');

var url='https://raw.githubusercontent.com/acciondelarroque-creator/clima-larroque/main/clima-localidades.json?x='+Date.now();
var icon=root.querySelector('#clima-icon'),temp=root.querySelector('#clima-temp'),state=root.querySelector('#clima-state'),meta=root.querySelector('#clima-meta'),days=root.querySelector('#clima-days'),sel=root.querySelector('#clima-loc'),data=null;

function weatherIcon(s){
s=(s||'').toLowerCase();
if(/torment/.test(s))return'⛈️';
if(/lluv|chaparr/.test(s))return'🌧️';
if(/nieve/.test(s))return'🌨️';
if(/niebla|neblina/.test(s))return'🌫️';
if(/nublado|cubierto/.test(s))return'☁️';
if(/parcial|algo nublado/.test(s))return'⛅';
if(/despejado|soleado/.test(s))return'☀️';
return'🌤️';
}
function dayName(v){
var z=new Date(v+'T12:00:00');
return isNaN(z)?v:z.toLocaleDateString('es-AR',{weekday:'short',day:'numeric'}).replace('.','').toUpperCase();
}
function render(a){
if(!a)return;
sel.value=String(a.id);
temp.textContent=a.actual&&a.actual.temperatura!=null?Math.round(a.actual.temperatura)+'°':'—°';
state.textContent=a.actual&&a.actual.estado||'Sin descripción';
icon.textContent=weatherIcon(a.actual&&a.actual.estado);
meta.textContent='SMN'+(a.actual&&a.actual.humedad!=null?' · 💧 '+Math.round(a.actual.humedad)+'%':'');
days.innerHTML=(a.pronostico||[]).slice(0,6).map(function(q,i){
return '<div class="day"><div class="name">'+(i?'':'HOY · ')+dayName(q.fecha)+'</div><div class="wicon">'+weatherIcon(q.estado)+'</div><div><span class="vals">'+(q.max!=null?Math.round(q.max)+'°':'—')+'</span> <span class="min">/ '+(q.min!=null?Math.round(q.min)+'°':'—')+'</span><div class="rain">☂ '+(q.lluvia!=null?Math.round(q.lluvia)+'%':'—')+'</div></div></div>';
}).join('');
}
function choose(id){
if(!data)return;
var a=(data.localidades||[]).find(function(v){return String(v.id)===String(id)});
if(a){
render(a);
try{localStorage.setItem('accionClimaLocalidad',a.id)}catch(e){}
}
}
sel.addEventListener('change',function(){choose(this.value)});

fetch(url,{cache:'no-store'})
.then(function(r){if(!r.ok)throw 0;return r.json()})
.then(function(j){
data=j;
var saved=null;
try{saved=localStorage.getItem('accionClimaLocalidad')}catch(e){}
var initial=(j.localidades||[]).find(function(a){return String(a.id)===String(saved)})
||(j.localidades||[]).find(function(a){return String(a.id)===String(j.default_id)})
||(j.localidades||[])[0];
if(initial)render(initial);
})
.catch(function(){state.textContent='Datos del SMN no disponibles'});

})();
</script>
</div>
