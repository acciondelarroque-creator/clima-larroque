<div id="accion-clima" style="width:100%;font-family:Arial,Helvetica,sans-serif">
<style>
#accion-clima *{box-sizing:border-box}
#accion-clima .bar{height:60px;width:100%;display:flex;align-items:stretch;background:#f7f9f8;border:1px solid #d5e0da;border-radius:6px;overflow:hidden;color:#173128}
#accion-clima .now{flex:0 0 240px;background:#006837;color:#fff;display:flex;align-items:center;padding:5px 10px;gap:8px;min-width:0}
#accion-clima .icon{width:36px;height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;font-size:25px;background:rgba(255,255,255,.12);border-radius:50%}
#accion-clima .now-info{min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:16px 24px 12px;column-gap:7px;align-items:center;flex:1}
#accion-clima .place{grid-column:1/3;min-width:0;display:flex;align-items:center;gap:4px;line-height:1}
#accion-clima .place select{border:0;background:transparent;color:#fff;font:800 9px Arial,Helvetica,sans-serif;text-transform:uppercase;outline:0;max-width:150px;cursor:pointer;padding:0}
#accion-clima .place select option{color:#173128;background:#fff;text-transform:none}
#accion-clima .geo{border:0;background:rgba(255,255,255,.15);color:#fff;width:18px;height:18px;border-radius:50%;padding:0;cursor:pointer;font-size:10px;line-height:18px}
#accion-clima .temp{font-size:27px;font-weight:800;line-height:1;letter-spacing:-1px}
#accion-clima .state{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:105px}
#accion-clima .meta{grid-column:1/3;font-size:7px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#accion-clima .days{display:flex;flex:1;min-width:0;background:#fff}
#accion-clima .day{flex:1;min-width:105px;border-right:1px solid #e0e8e3;padding:5px 8px;display:grid;grid-template-columns:1fr auto;grid-template-rows:16px 1fr;align-items:center}
#accion-clima .day:last-child{border:0}
#accion-clima .name{font-size:8px;font-weight:800;color:#52645b;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
#accion-clima .wicon{grid-row:1/3;grid-column:2;font-size:22px;line-height:1;margin-left:6px}
#accion-clima .vals{font-size:13px;font-weight:800;color:#173128;line-height:1}
#accion-clima .min{font-size:9px;color:#89958f;font-weight:500}
#accion-clima .rain{font-size:10px;color:#006837;margin-top:3px;line-height:1;font-weight:700}
#accion-clima .rain::first-letter{font-size:13px}
#accion-clima .msg{display:none}
@media(max-width:699px){
#accion-clima .bar{height:60px;border-radius:5px}
#accion-clima .now{flex-basis:170px!important;padding:5px 7px!important;gap:6px!important}
#accion-clima .icon{width:30px;height:30px;flex-basis:30px;font-size:21px}
#accion-clima .now-info{grid-template-rows:15px 23px 11px;column-gap:4px}
#accion-clima .place select{font-size:8px;max-width:115px}
#accion-clima .temp{font-size:23px}
#accion-clima .state{font-size:8px;max-width:78px}
#accion-clima .meta{font-size:6px}
#accion-clima .days{display:flex;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;background:#fff}
#accion-clima .days::-webkit-scrollbar{display:none}
#accion-clima .days.dragging{cursor:grabbing;scroll-snap-type:none}
#accion-clima .days .day{flex:0 0 105px;scroll-snap-align:start;padding:5px 7px}
#accion-clima .name{font-size:8px}.wicon{font-size:20px!important}.vals{font-size:12px!important}.min{font-size:8px!important}.rain{font-size:9px!important;font-weight:700!important}.rain::first-letter{font-size:12px!important}
}
</style>
<div class="bar">
  <div class="now">
    <div class="icon" id="ci">🌤️</div>
    <div class="now-info">
      <div class="place">📍 <select id="cl"></select><button class="geo" id="cg" title="Usar mi ubicación">⌖</button></div>
      <div class="temp" id="ct">—°</div>
      <div class="state" id="cs">Cargando clima…</div>
      <div class="meta" id="cm">SMN</div>
    </div>
  </div>
  <div class="days" id="cd"></div>
  <div class="msg" id="cx"></div>
</div>
<script>
(function(){
var r=document.getElementById('accion-clima');if(!r||r.dataset.ready)return;r.dataset.ready='1';
var u='https://raw.githubusercontent.com/acciondelarroque-creator/clima-larroque/main/clima-localidades.json?x='+Date.now(),t=r.querySelector('#ct'),st=r.querySelector('#cs'),m=r.querySelector('#cm'),ic=r.querySelector('#ci'),d=r.querySelector('#cd'),x=r.querySelector('#cx'),sel=r.querySelector('#cl'),geo=r.querySelector('#cg'),data=null;
function I(q){q=(q||'').toLowerCase();if(/torment/.test(q))return'⛈️';if(/lluv|chaparr/.test(q))return'🌧️';if(/nieve/.test(q))return'🌨️';if(/niebla|neblina/.test(q))return'🌫️';if(/nublado|cubierto/.test(q))return'☁️';if(/parcial|algo nublado/.test(q))return'⛅';if(/despejado|soleado/.test(q))return'☀️';return'🌤️'}
function D(v){if(!v)return'';var z=new Date(v+'T12:00:00');return isNaN(z)?String(v):z.toLocaleDateString('es-AR',{weekday:'short',day:'numeric'}).replace('.','').toUpperCase()}
function R(a){if(!a)return;t.textContent=a.actual&&a.actual.temperatura!=null?Math.round(a.actual.temperatura)+'°':'—°';st.textContent=a.actual&&a.actual.estado||'Sin descripción';ic.textContent=I(a.actual&&a.actual.estado);m.textContent='SMN'+(a.actual&&a.actual.humedad!=null?' · 💧 '+Math.round(a.actual.humedad)+'%':'');d.innerHTML=(a.pronostico||[]).slice(0,6).map(function(q,i){return '<div class="day"><div class="name">'+(i?'':'HOY · ')+D(q.fecha)+'</div><div class="wicon">'+I(q.estado)+'</div><div><span class="vals">'+(q.max!=null?Math.round(q.max)+'°':'—')+'</span> <span class="min">/'+(q.min!=null?Math.round(q.min)+'°':'—')+'</span><div class="rain">☂ '+(q.lluvia!=null?Math.round(q.lluvia)+'%':'—')+'</div></div></div>'}).join('')}
function elegir(id){var a=(data.localidades||[]).find(function(v){return String(v.id)===String(id)});if(a){sel.value=a.id;R(a);try{localStorage.setItem('accionClimaLocalidad',a.id)}catch(e){}}}
function llenar(){sel.innerHTML=(data.localidades||[]).slice().sort(function(a,b){return a.localidad.localeCompare(b.localidad,'es')}).map(function(a){return '<option value="'+a.id+'">'+a.localidad+'</option>'}).join('');var guardado=null;try{guardado=localStorage.getItem('accionClimaLocalidad')}catch(e){};var inicial=(data.localidades||[]).find(function(a){return String(a.id)===String(guardado)})||(data.localidades||[]).find(function(a){return String(a.id)===String(data.default_id)})||(data.localidades||[])[0];if(inicial)elegir(inicial.id)}
sel.addEventListener('change',function(){elegir(this.value)});
geo.addEventListener('click',function(){if(!navigator.geolocation)return;geo.textContent='…';navigator.geolocation.getCurrentPosition(function(p){var best=null,dist=Infinity;(data.localidades||[]).forEach(function(a){var la=+a.lat,lo=+a.lon;if(!isFinite(la)||!isFinite(lo))return;var dl=(la-p.coords.latitude),dn=(lo-p.coords.longitude)*Math.cos(p.coords.latitude*Math.PI/180),z=dl*dl+dn*dn;if(z<dist){dist=z;best=a}});if(best)elegir(best.id);geo.textContent='⌖'},function(){geo.textContent='⌖'},{enableHighAccuracy:false,timeout:8000})});
fetch(u,{cache:'no-store'}).then(function(q){if(!q.ok)throw 0;return q.json()}).then(function(q){data=q;llenar()}).catch(function(){st.textContent='Datos del SMN no disponibles';m.textContent='SMN';x.textContent=''})
var down=false,sx=0,ss=0;d.addEventListener('pointerdown',function(e){down=true;sx=e.clientX;ss=d.scrollLeft;d.classList.add('dragging');d.setPointerCapture(e.pointerId)});d.addEventListener('pointermove',function(e){if(down)d.scrollLeft=ss-(e.clientX-sx)});['pointerup','pointercancel'].forEach(function(q){d.addEventListener(q,function(){down=false;d.classList.remove('dragging')})})
})();
</script>
</div>
